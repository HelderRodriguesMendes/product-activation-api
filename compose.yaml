services:
  postgres:
    image: postgres:17
    container_name: product-activation-postgres
    environment:
      POSTGRES_DB: product_activation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_activation_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: product-activation-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command:
      - "--verbose"


volumes:
  postgres_data: