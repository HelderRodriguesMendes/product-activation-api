
services:
  postgres:
    image: postgres:17
    container_name: product-activation-postgres
    environment:
      POSTGRES_DB: product_activation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_activation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: product-activation-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command:
      - "--verbose"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-activation-api:latest
    container_name: product-activation-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_activation_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PROVIDER_BASE_URL: http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

volumes:
  postgres_data:
